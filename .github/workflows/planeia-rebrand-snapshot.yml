name: Apply Sousa Murray Planeia rebrand

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply approved Planeia rebrand
        shell: bash
        run: |
          set -euo pipefail
          python .github/apply-planeia-rebrand.py
          find functions scripts static -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check
      - name: Commit rebranded website
        shell: bash
        run: |
          set -euo pipefail
          rm .github/apply-planeia-rebrand.py
          rm .github/workflows/planeia-rebrand-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebrand Planyx as Sousa Murray Planeia"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
