name: Validate Planyx

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check repository baseline
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run type-check 2>&1 | tee typecheck.log

      - name: Build production application
        id: build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Run critical regression tests
        id: targeted
        if: always()
        shell: bash
        run: |
          set -o pipefail
          node --test \
            tests/admin-ui-payments-reliability.test.mjs \
            tests/stripe-support-coming-soon-fixes.test.mjs \
            tests/checkout-trial.test.mjs \
            tests/stripe-webhook.test.mjs \
            tests/manual-subscription-claim.test.mjs \
            tests/subscription-catalogue-persistence.test.mjs \
            tests/admin-subscription-plans-editor.test.mjs \
            tests/account-type-itinerary-access.test.mjs \
            tests/public-bundle-hygiene.test.mjs \
            tests/admin-pin-visual-style.test.mjs \
            tests/contact-page-status-enforcement.test.mjs \
            tests/chatbot-conversation-first.test.mjs \
            tests/atlassian-ticket-integration.test.mjs \
            tests/admin-keyboard-shortcuts.test.mjs \
            tests/admin-support-manuals.test.mjs \
            tests/admin-utility-side-tabs.test.mjs \
            tests/session-authority-centre.test.mjs \
            tests/authority-reporting-route-stations.test.mjs \
            tests/authority-report-user-session-linking.test.mjs \
            tests/authority-session-card-layout.test.mjs \
            tests/authority-report-template-library.test.mjs \
            tests/admin-age-verification-control.test.mjs \
            tests/customer-crm-age-verification.test.mjs \
            tests/age-16-safeguarding.test.mjs 2>&1 | tee targeted-tests.log

      - name: Run full repository test baseline
        id: fulltests
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test tests/*.test.mjs 2>&1 | tee full-tests.log

      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-output
          path: |
            typecheck.log
            build.log
            targeted-tests.log
            full-tests.log
          if-no-files-found: warn
          retention-days: 7

      - name: Publish validation summary
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TARGETED_OUTCOME: ${{ steps.targeted.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          FULL_TEST_OUTCOME: ${{ steps.fulltests.outcome }}
        run: |
          printf 'Production build: %s\nCritical regression tests: %s\nRepository type-check baseline: %s\nFull test baseline: %s\n' \
            "$BUILD_OUTCOME" "$TARGETED_OUTCOME" "$TYPECHECK_OUTCOME" "$FULL_TEST_OUTCOME"

          {
            echo '### Planyx validation'
            echo
            echo "- Production build: **$BUILD_OUTCOME**"
            echo "- Critical regression tests: **$TARGETED_OUTCOME**"
            echo "- Repository type-check baseline: **$TYPECHECK_OUTCOME**"
            echo "- Full test baseline: **$FULL_TEST_OUTCOME**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$TYPECHECK_OUTCOME" != success ]; then
            echo '::warning::The inherited TypeScript baseline still contains errors. Download validation-output for the complete log.'
          fi
          if [ "$FULL_TEST_OUTCOME" != success ]; then
            echo '::warning::The inherited full test baseline still contains failures. Download validation-output for the complete log.'
          fi
